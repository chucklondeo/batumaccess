name: Daily SEO content update

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-seo-topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/generate-seo-content.mjs

      - run: npm run build

      - name: Open PR with the new SEO content
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Rotate SEO hub keyword topics"
          title: "Daily SEO content update"
          body: |
            Automated keyword rotation for the SEO hub page, generated by
            `scripts/generate-seo-content.mjs` from the product/market
            keyword bank. Review the diff in `data/seo-topics.json` before
            merging — merging rebuilds `out/` with the new content live.
          branch: seo-auto/update
          delete-branch: true
